[tool.ruff]
line-length = 88
target-version = "py312"
src = ["src", "config"]

[tool.ruff.lint]
select = [
    "E",
    "W",
    "F",
    "I",
    "B",
]

ignore = [
    "E111",
    "E114",
    "E117",
    "W191",
]

[tool.ruff.format]
quote-style = "double"
indent-style = "space"
line-ending = "auto"

[tool.pytest.ini_options]
pythonpath = ["."]